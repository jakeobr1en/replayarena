name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          clang-format --version
          find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run -Werror

  build-test:
    name: ${{ matrix.sanitizer }} (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
        compiler:
          - { name: gcc, cc: gcc-13, cxx: g++-13 }
          - { name: clang, cc: clang-16, cxx: clang++-16 }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DREPLAYARENA_SANITIZE=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure
